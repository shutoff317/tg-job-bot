name: Fetch Jobs

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Run script
        env:
          SOURCE_CHANNEL: Freshers_job_updates_by_akhila
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHAT: "@mychannel"
          POST_BACKLOG: "1"
          MAX_POST: "5"
        run: python fetch_jobs.py

      - name: Save jobs.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add jobs.json
          git commit -m "update jobs" || echo "no changes"
          git push
