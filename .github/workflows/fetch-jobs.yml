name: Fetch jobs

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write            # needed to commit jobs.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          SOURCE_CHANNEL: availablejobs4u
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}       # optional
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}   # optional
        run: python bot.py

      - name: Commit jobs.json
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "Update jobs.json"
          git push
